# Turborepo integration example — demonstrates automatic watch path resolution.
#
# Don queries `turbo run --dry-run=json` at startup to determine the task graph
# and source inputs. Watch patterns are auto-resolved from Turbo's input tracking.
# When package.json or turbo.json files change, Don re-queries Turbo to update watches.
#
# Run with: cargo run -- -c examples/turbo/don.toml

[services.web]
run.cmd = "node"
run.args = ["apps/web/src/server.js"]
ready.tcp = "127.0.0.1:3000"
ready.interval = "200ms"

# Turborepo integration: Don queries the task graph to auto-resolve watch patterns.
# Instead of manually listing watch = ["apps/web/src/**", "packages/utils/src/**"],
# Don discovers these from `turbo run dev --dry-run=json`.
#
# At startup, Don runs `turbo run build --filter=@example/web` (the build_task)
# as part of a batch build phase before starting services.
turbo.task = "dev"
turbo.build_task = "build"
turbo.filter = "@example/web"

[tasks.build]
cmd = "npx"
args = ["turbo", "run", "build"]
turbo.task = "build"
turbo.build_task = ""  # Already a build task itself; skip batch build.
