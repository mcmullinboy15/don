name: CI

# Run once per change. `pull_request` covers branches with an open PR; scoping
# `push` to main avoids a duplicate run on every PR-branch push while still
# testing direct pushes/merges to the default branch.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when new commits land on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    # Test on every OS we ship a binary for. macOS matters especially: the file
    # watcher uses a different notify backend there (FSEvents vs inotify), and
    # the worst watch regressions have been macOS-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install latest stable Rust
        shell: bash
        run: |
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

          rustc --version
          cargo --version

      # The Go preset integration tests spawn a real `go` toolchain. The Ubuntu
      # runner image ships one, but the macOS image does not — install it
      # explicitly so both platforms exercise the same tests.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: cargo build --locked

      - name: Test
        # --no-fail-fast so a failure in one test binary doesn't hide failures
        # in the ones that sort after it — important while bringing up a new
        # platform (macOS) where several suites may need attention at once.
        run: cargo test --locked --no-fail-fast

      - name: Lint
        run: cargo clippy --locked -- -D warnings

  # `web/dist` is committed because it gets embedded into the binary and
  # neither crates.io nor cargo-dist can run npm. That only works if the
  # committed bundle actually matches the sources, so rebuild it and fail on
  # any drift. Linux-only: the bundle is platform-independent.
  web-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Build
        run: npm --prefix web run build

      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --exit-code --stat web/dist; then
            echo "::error::web/dist is stale — run 'npm --prefix web run build' and commit the result"
            exit 1
          fi
