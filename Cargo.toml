[package]
name = "don"
version = "0.1.0"
edition = "2024"
description = "Boss of your dev environment"
license = "MIT"


[dependencies]
axum = "0.8"
bytes = "1"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.29", features = ["signal", "process", "fs"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
pty-process = { version = "0.5", features = ["async"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
